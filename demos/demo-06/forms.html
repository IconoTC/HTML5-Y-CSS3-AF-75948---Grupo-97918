<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo de HTML</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <style>
        .form-control {
            display: block;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>
    <header role="banner">
        <h1>Demo de HTML: Contactos</h1>
        <p class="h4">Desarrollador Web</p>
        <nav role="navigation">
            <menu>
                <li><a href="./index.html#personal-info">Información personal</a></li>
                <li><a href="./index.html#projects">Proyectos</a></li>
            </menu>
        </nav>
    </header>
    <section id="contact" aria-label="Contacto">
        <hgroup>
            <h2>Contacto</h2>
            <p>¿Quieres contactar conmigo?</p>
        </hgroup>
        <form method="get">
            <label class="form-control" for="user-name">
                <span>Nombre:</span>
                <input type="text" name="user-name" id="user-name" placeholder="Dime tu nombre" 
                minlength="2" maxlength="50" required>
            </label>
            <label class="form-control">
                Teléfono:
                <input type="tel" name="phone" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}" placeholder="123-456-7890">
            </label>
            <label class="form-control">
                Edad:
                <input type="number" name="age" min="0" max="120">
            </label>
            <label class="form-control">
                Contraseña:
                <input type="password" id="password" name="password" minlength="4" maxlength="8" required>
            </label>
            <label class="form-control">
                Fecha de nacimiento:
                <input type="date" id="dob" name="dob" required>
            </label>
            <label class="form-control">
                Hora de contacto:
                <input type="time" id="contact-time" name="contact-time">
            </label>
            <label class="form-control">
                Avatar
                <input type="file" name="file" id="file" accept=".pdf,.doc,.docx,image/*">
            </label>
            <div class="form-control">
                <label for="email">Correo electrónico:</label>
                <input type="email" id="email" name="email">
            </div>
            <label class="form-control">
                <span>Mensaje:</span>
                <textarea id="message" name="message"></textarea>
            </label>
            <!-- Radio buttons: -->
            <fieldset class="form-control">
                <legend>¿Cómo prefieres que te contacte?</legend>
                <label>
                    <input type="radio" name="contact-method" value="email" required>
                    Correo electrónico
                </label>
                <label>
                    <input type="radio" name="contact-method" value="phone">
                    Teléfono
                </label>
            </fieldset>
            <!-- Checkbox: -->
            <fieldset class="form-control">
                <legend>Suscribirse a:</legend>
                <label>
                    <input type="checkbox" name="subscribe-newsletter">
                    Newsletter
                </label>
                <label>
                    <input type="checkbox" name="subscribe-updates">
                    Actualizaciones de productos
                </label>
            </fieldset>
            <label class="form-control">País:
                <select name="country" required>
                    <option value="">Selecciona un país</option>
                    <option value="es">España</option>
                    <option value="fr">Francia</option>
                    <option value="de">Alemania</option>
                    <option value="other">Otros</option>
                </select>
            </label>
            <div class="form-control">
                <button type="submit">Enviar</button>
            </div>
        </form>

    </section>

</body>

</html>
